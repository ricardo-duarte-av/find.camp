[versions]
agp = "9.2.1"
kotlin = "2.3.21"
maplibre = "11.6.1"
okhttp = "4.12.0"
kotlinxSerializationJson = "1.7.3"
lifecycleViewmodelCompose = "2.9.0"
playServicesLocation = "21.3.0"
coil = "3.1.0"
material3Expressive = "1.5.0-alpha19"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.0"
activityCompose = "1.10.1"
